services:
    dev_db:
        image: postgres:16
        container_name: com2020-dev-db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: com2020_dev
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d com2020_dev"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    db_data:
