<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="index.css">
        <title>Healthy Streets: Route Planner</title>
    </head>
    <body class="bg-gray-100 text-gray-800">

        <nav class="bg-white p-4 shadow-sm flex justify-between items-center">
            <h1 class="text-xl font-bold text-purple-700">Healthy Streets: Route Planner</h1>  
            <button class="px-4 py-2 border rounded hover:bg-gray-50">Menu</button> 
        </nav>

        <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

            <aside class="lg:col-span-1 space-y-6 bg-white p-6 rounded-xl shadow">
                <div>
                    <h3 class="text-lg font-bold border-b pb-2 mb-4">Weights</h3>
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <div class="flex justify-between">
                                <label for="safety" class="text-sm font-medium">Safety</label> <span class="text-xs font-bold text-gray-800" id="safety_span"></span>
                            </div>
                            <input type="range" id="safety_range" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        </div>

                        <div class="space-y-2">
                            <div class="flex justify-between">
                                <label for="lighting" class="text-sm font-medium">Lighting</label> <span class="text-xs font-bold text-gray-800" id="lighting_span"></span>
                            </div>
                            <input type="range" id="lighting_range" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        </div>

                        <div class="space-y-2">
                            <div class="flex justify-between">
                                <label for="green" class="text-sm font-medium">Green Spaces</label> <span class="text-xs font-bold text-gray-800" id="green_span"></span>
                            </div>
                            <input type="range" id="green_range" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        </div>

                        <div class="space-y-2">
                            <div class="flex justify-between">
                                <label for="crossings" class="text-sm font-medium">Crossings</label> <span class="text-xs font-bold text-gray-800" id="crossings_span"></span>
                            </div>
                            <input type="range" id="crossings_range" min="1" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-lg font-bold border-b pb-2 mb-4">Route Options</h3> <div class ="space-y-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="fastest-route" class="w-4 h-4 text-green-600">
                            <label for="fastest-route" class="text-sm">Fastest Route</label>
                        </div>

                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="safest-route" class="w-4 h-4 text-green-600">
                            <label for="safest-route" class="text-sm">Safest Route</label>
                        </div>

                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="scenic-route" class="w-4 h-4 text-green-600">
                            <label for="scenic-route" class="text-sm">Scenic Route</label>
                        </div>

                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="avoid-crossings" class="w-4 h-4 text-green-600">
                            <label for="avoid-crossings" class="text-sm">Avoid Crossings</label>
                        </div>
                    </div>
                </div>

                <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
                    Plan Route </button>
            </aside>

            <div class="lg:col-span-3 space-y-6">
                <div class="bg-gray-200 rounded-xl h-96 flex items-center justify-center relative overflow-hidden border-2 border-dashed border-gray-400">
                    <span class="text-gray-500 font-medium">Interactive Map Placeholder</span> <div id="map" class="absolute inset-0"></div>
                </div>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
